<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1340" viewBox="0 0 1280 1340" font-family="'Sora','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13315C"/>
      <stop offset="1" stop-color="#0B2A4A"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="45%" stop-color="#F5B301"/>
      <stop offset="100%" stop-color="#F5B301" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0B2A4A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- page bg -->
  <rect width="1280" height="1340" fill="#ffffff"/>

  <!-- NAV -->
  <text x="64" y="62" font-size="24" font-weight="700" fill="#0B2A4A">Energy<tspan fill="#F5B301">Lab</tspan></text>
  <text x="760" y="60" font-size="16" fill="#5b6b7b">Služby</text>
  <text x="850" y="60" font-size="16" fill="#5b6b7b">Reference</text>
  <text x="960" y="60" font-size="16" fill="#5b6b7b">Blog</text>
  <rect x="1040" y="38" width="120" height="40" rx="20" fill="#0B2A4A"/>
  <text x="1100" y="63" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Kontakt</text>
  <line x1="64" y1="96" x2="1216" y2="96" stroke="#eef2f7" stroke-width="1"/>

  <!-- HERO -->
  <text x="64" y="230" font-size="20" font-weight="600" fill="#F5B301" letter-spacing="2">ENERGIE, KTERÁ DÁVÁ SMYSL</text>
  <text x="62" y="320" font-size="72" font-weight="800" fill="#0B2A4A">Snižte účty</text>
  <text x="62" y="400" font-size="72" font-weight="800" fill="#0B2A4A">za energii.</text>
  <text x="64" y="460" font-size="22" fill="#5b6b7b">Návrh, instalace a optimalizace na míru.</text>
  <text x="64" y="492" font-size="22" fill="#5b6b7b">Vše spočítané dopředu, bez překvapení.</text>

  <!-- CTA -->
  <rect x="64" y="540" width="250" height="58" rx="29" fill="#F5B301"/>
  <text x="189" y="577" font-size="18" font-weight="700" fill="#0B2A4A" text-anchor="middle">Spočítat úsporu →</text>
  <text x="346" y="577" font-size="18" font-weight="600" fill="#0B2A4A">Jak to funguje</text>

  <!-- HERO VISUAL -->
  <rect x="712" y="150" width="504" height="470" rx="28" fill="url(#navy)"/>
  <circle cx="964" cy="385" r="230" fill="url(#sun)"/>
  <circle cx="964" cy="385" r="92" fill="#F5B301"/>
  <circle cx="964" cy="385" r="92" fill="none" stroke="#FFE08A" stroke-width="2" opacity="0.6"/>
  <g stroke="#FFD45A" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="964" y1="235" x2="964" y2="200"/>
    <line x1="964" y1="535" x2="964" y2="570"/>
    <line x1="814" y1="385" x2="779" y2="385"/>
    <line x1="1114" y1="385" x2="1149" y2="385"/>
    <line x1="858" y1="279" x2="833" y2="254"/>
    <line x1="1070" y1="279" x2="1095" y2="254"/>
    <line x1="858" y1="491" x2="833" y2="516"/>
    <line x1="1070" y1="491" x2="1095" y2="516"/>
  </g>

  <!-- FEATURES SECTION -->
  <rect x="0" y="700" width="1280" height="400" fill="#f3f6fb"/>
  <text x="64" y="784" font-size="36" font-weight="800" fill="#0B2A4A">Co pro vás uděláme</text>

  <!-- card 1 -->
  <rect x="64" y="824" width="350" height="210" rx="20" fill="#ffffff" filter="url(#soft)"/>
  <circle cx="108" cy="876" r="26" fill="#FFF3D1"/>
  <circle cx="108" cy="876" r="10" fill="#F5B301"/>
  <text x="100" y="940" font-size="22" font-weight="700" fill="#0B2A4A">Audit &amp; návrh</text>
  <text x="100" y="975" font-size="16" fill="#5b6b7b">Změříme spotřebu a navrhneme</text>
  <text x="100" y="998" font-size="16" fill="#5b6b7b">řešení přesně na míru.</text>

  <!-- card 2 -->
  <rect x="465" y="824" width="350" height="210" rx="20" fill="#ffffff" filter="url(#soft)"/>
  <circle cx="509" cy="876" r="26" fill="#E3ECFa"/>
  <rect x="500" y="867" width="18" height="18" rx="4" fill="#0B2A4A"/>
  <text x="501" y="940" font-size="22" font-weight="700" fill="#0B2A4A">Instalace</text>
  <text x="501" y="975" font-size="16" fill="#5b6b7b">Profesionální montáž</text>
  <text x="501" y="998" font-size="16" fill="#5b6b7b">s plnou zárukou.</text>

  <!-- card 3 -->
  <rect x="866" y="824" width="350" height="210" rx="20" fill="#ffffff" filter="url(#soft)"/>
  <circle cx="910" cy="876" r="26" fill="#FFF3D1"/>
  <path d="M902 876 l6 6 l12 -14" stroke="#F5B301" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="902" y="940" font-size="22" font-weight="700" fill="#0B2A4A">Optimalizace</text>
  <text x="902" y="975" font-size="16" fill="#5b6b7b">Hlídáme úspory a ladíme</text>
  <text x="902" y="998" font-size="16" fill="#5b6b7b">výkon i po instalaci.</text>

  <!-- PALETTE / SPEC -->
  <text x="64" y="1170" font-size="18" font-weight="700" fill="#0B2A4A">Paleta &amp; typografie</text>
  <rect x="64" y="1195" width="90" height="90" rx="14" fill="#0B2A4A"/>
  <text x="64" y="1310" font-size="13" fill="#5b6b7b">#0B2A4A</text>
  <rect x="170" y="1195" width="90" height="90" rx="14" fill="#F5B301"/>
  <text x="170" y="1310" font-size="13" fill="#5b6b7b">#F5B301</text>
  <rect x="276" y="1195" width="90" height="90" rx="14" fill="#f3f6fb" stroke="#e3e9f1"/>
  <text x="276" y="1310" font-size="13" fill="#5b6b7b">#f3f6fb</text>
  <rect x="382" y="1195" width="90" height="90" rx="14" fill="#5b6b7b"/>
  <text x="382" y="1310" font-size="13" fill="#5b6b7b">#5b6b7b</text>
  <text x="520" y="1230" font-size="22" font-weight="800" fill="#0B2A4A">Sora — nadpisy</text>
  <text x="520" y="1270" font-size="18" fill="#5b6b7b">Inter — běžný text, čistý a čitelný</text>
</svg>
